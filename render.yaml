# Render Blueprint: always-on paid web service + paid Postgres (CLAUDE.md section 3).
services:
  - type: web
    name: undo
    runtime: node
    plan: 0.5c-512mb
    region: oregon
    buildCommand: npm ci && npm run build
    preDeployCommand: npm run db:migrate
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: PAYPAL_ENV
        value: sandbox
      - key: PAYPAL_BASE_URL
        value: https://api-m.sandbox.paypal.com
      - key: DATABASE_URL
        fromDatabase:
          name: undo-db
          property: connectionString
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: AGENT_PLATFORM_CLIENT_ID
        sync: false
      - key: AGENT_PLATFORM_CLIENT_SECRET
        sync: false
      - key: NEXT_PUBLIC_PAYPAL_CLIENT_ID
        sync: false
      - key: LLM_PROVIDER
        value: anthropic
      - key: LLM_MODEL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: LLM_DAILY_SPEND_CAP_USD
        value: "5"
      - key: JUDGE_MODE
        value: "true"
      - key: JUDGE_LOGIN_PASSWORD
        sync: false
      - key: AG_STUDIO_LICENSE_KEY
        sync: false
      - key: APP_BASE_URL
        sync: false

databases:
  - name: undo-db
    plan: 0.1c-256mb
    region: oregon
    databaseName: undo
    user: undo
    postgresMajorVersion: "17"
